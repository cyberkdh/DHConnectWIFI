name: CI Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [ "Win32", "x64" ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build solution (Release)
        run: msbuild DHConnectWifi\DHConnectWIFI.sln /restore /t:Build /p:Configuration=Release /p:Platform=${{ matrix.platform }} /v:minimal

      - name: Verify build output
        shell: pwsh
        run: |
          $exePath = "output\${{ matrix.platform }}\Release\DHConnectWIFI.exe"
          if (-not (Test-Path -LiteralPath $exePath)) {
            throw "Build output not found: $exePath"
          }
